# Local development: ./mvnw spring-boot:run turns this profile on.

# A throwaway signing key, so there's nothing to set up. Restarting signs everyone out.
hypeman.auth.allow-ephemeral-signing-key=true
# The bundle id the app is signed with for the personal-team builds.
hypeman.auth.apple.client-ids=${HYPEMAN_AUTH_APPLE_CLIENT_IDS:com.bharatekarhade.hypeman}
# Without a Sign in with Apple key, delete accounts without revoking their Apple sign-in.
hypeman.auth.apple-revocation.skip-when-unconfigured=true
# A well-known admin token, so the admin endpoints work with nothing to set up. Never use it anywhere else.
hypeman.admin.token=${HYPEMAN_ADMIN_TOKEN:local-admin-token-for-development-only}
# Secrets for local development live in .env at the project root (gitignored; see .env.example).
spring.config.import=optional:file:.env[.properties]
