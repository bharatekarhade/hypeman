spring.application.name=hypeman

# Render passes the port in PORT. The database comes from SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD in
# production, and from compose.yaml in development.
server.port=${PORT:8080}

# Flyway owns the schema; Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
