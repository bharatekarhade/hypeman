spring.application.name=hypeman

# Render passes the port in PORT. The database comes from SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD in
# production, and from compose.yaml in development.
server.port=${PORT:8080}

# Flyway owns the schema; Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The request id on every log line.
logging.pattern.correlation=[%X{requestId:-}] 

# Sign-in. Secrets come only from environment variables.
hypeman.auth.issuer=hypeman
hypeman.auth.access-token-ttl=15m
hypeman.auth.refresh-token-ttl=60d
hypeman.auth.signing-key=${HYPEMAN_AUTH_SIGNING_KEY:}
hypeman.auth.allow-ephemeral-signing-key=false
hypeman.auth.apple.jwk-set-uri=https://appleid.apple.com/auth/keys
hypeman.auth.apple.issuers=https://appleid.apple.com
hypeman.auth.apple.client-ids=${HYPEMAN_AUTH_APPLE_CLIENT_IDS:}
hypeman.auth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
hypeman.auth.google.issuers=https://accounts.google.com,accounts.google.com
hypeman.auth.google.client-ids=${HYPEMAN_AUTH_GOOGLE_CLIENT_IDS:}
# Revoking Sign in with Apple on account deletion: a Sign in with Apple key from the developer account.
hypeman.auth.apple-revocation.base-url=https://appleid.apple.com
hypeman.auth.apple-revocation.team-id=${HYPEMAN_AUTH_APPLE_TEAM_ID:}
hypeman.auth.apple-revocation.key-id=${HYPEMAN_AUTH_APPLE_KEY_ID:}
hypeman.auth.apple-revocation.private-key=${HYPEMAN_AUTH_APPLE_PRIVATE_KEY:}
hypeman.auth.apple-revocation.skip-when-unconfigured=false
